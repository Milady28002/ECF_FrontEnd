<section class="signin-hero d-flex align-items-center">
  <div class="signin-hero__overlay"></div>

  <div class="container position-relative">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">

        <div class="card signin-card border-0">
          <div class="card-body p-4 p-md-5">

            <h1 class="text-center mb-4">Connexion</h1>

            <form aria-label="Formulaire de connexion">
              <div class="mb-3">
                <label for="EmailInput" class="form-label">Email</label>
                <input type="email" class="form-control" id="EmailInput" placeholder="email@mail.fr" name="Email" required> 
                  <div class="invalid-feedback">
                  Le mail et le mot de passe ne correspondent pas

                </div>
              </div>

              <div class="mb-3">
                <label for="PasswordInput" class="form-label">Mot de passe</label>
                <input type="password" class="form-control" id="PasswordInput" name="Password" required>
              </div>

              <div class="text-center mt-2 mb-3">
                <a href="/modifPassword" onclick="route()" class="signin-link-light small">
                  Mot de passe oublié ?
                </a>
              </div>

              <div class="text-center">
                <button type="button" class="btn btn-primary" id="btnSignin">
                  Valider
                </button>
              </div>
            </form>

            <div class="text-center pt-3">
              <a href="/signup" onclick="route()" class="signin-link-light">
                Vous n’avez pas de compte ? Inscrivez-vous ici !
              </a>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>
</section>
