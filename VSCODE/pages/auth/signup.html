<section class="signup-hero d-flex align-items-center">
  <div class="signup-hero__overlay"></div>

  <div class="container position-relative">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">

        <div class="card signup-card border-0">
          <div class="card-body p-2 p-md-3">

            <h1 class="text-center mb-4">Inscription</h1>

            <form aria-label="Formulaire d'inscription">
              <div class="mb-3">
                <label for="NomInput" class="form-label">Nom</label>
                <input type="text" class="form-control" id="NomInput" placeholder="Votre nom" name="Nom" required >
              </div>

              <div class="mb-3">
                <label for="PrenomInput" class="form-label">Prénom</label>
                <input type="text" class="form-control" id="PrenomInput" placeholder="Votre prénom" name="Prenom" required>
              </div>

            <div class="mb-3">
                <label for="TelephoneInput" class="form-label">Téléphone</label>
                <input type="tel" class="form-control" id="TelephoneInput" placeholder="Votre n° de téléphone" name="Telephone" required>
              </div>

              <div class="mb-3">
                <label for="EmailInput" class="form-label">Email</label>
                <input type="email" class="form-control" id="EmailInput" placeholder="email@mail.fr" name="Email" required>
              </div>

              <div class="mb-3">
                <label for="PasswordInput" class="form-label">Mot de passe</label>
                <input type="password" class="form-control" id="PasswordInput" name="Password" required>
              </div>

              <div class="mb-3">
                <label for="ValidatePasswordInput" class="form-label">
                  Validez votre mot de passe
                </label>
                <input type="password" class="form-control" id="ValidatePasswordInput" name="PasswordConfirm" required>
              </div>

              <div class="text-center">
                <button type="submit" class="btn btn-primary">
                  Inscription
                </button>
              </div>
            </form>

            <div class="text-center pt-3">
              <a href="/signin" class="signup-link">
                Vous avez déjà un compte ? Connectez-vous ici !
              </a>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>
</section>
