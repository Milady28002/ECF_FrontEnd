<section class="contact_hero">
  <div class="container">
    <div class="contact_card">
      <h1 class="contact-title">
        Une question, une idée ou une envie,
        <span>contactez-nous !</span>
      </h1>

      <form id="contactForm" class="contact-form" aria-labelledby="contact-title">
        <div class="field">
          <label for="titre">Titre</label>
          <input id="titre" name="titre" type="text" required>
        </div>

        <div class="field">
          <label for="email">Mail</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="message">Description</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary contact-submit">Envoyer</button>

        <p id="contactMessage" class="mt-3" aria-live="polite" role="status"></p>
      </form>
    </div>
  </div>
</section>
