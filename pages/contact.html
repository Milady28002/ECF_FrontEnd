<section class="contact_hero">
    <div class="container">
        <div class="contact_card">
            <h2>Une question, une idée ou une envie,<br>contactez-nous !</h2>

            <form class="contact-form" action="#" method="post">
                <div class="field">
                    <label for="nom">Nom</label>
                    <input id="nom" name="nom" type="text" autocomplete="family-name" required>
                </div>

                <div class="field">
                    <label for="prenom">Prénom</label>
                    <input id="prenom" name="prenom" type="text" autocomplete="given-name" required>
                </div>

                <div class="field">
                    <label for="email">Mail</label>
                    <input id="email" name="email" type="email" autocomplete="email" required>
                </div>

                <div class="field">
                    <label for="message">Votre message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary contact-submit">Envoyer</button>
            </form>
        </div>
    </div>
</section>
