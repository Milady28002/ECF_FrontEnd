<section class="container py-5">
  <h1>Gestion des employés</h1>

  <!-- Création -->
<div class="card p-4 mb-4">
  <h2>Créer un employé</h2>

  <form id="create-employee-form">
    <div class="mb-3">
      <label for="employee-lastname" class="form-label">Nom</label>
      <input type="text" id="employee-lastname" class="form-control" required>
    </div>

    <div class="mb-3">
      <label for="employee-firstname" class="form-label">Prénom</label>
      <input type="text" id="employee-firstname" class="form-control" required>
    </div>

    <div class="mb-3">
      <label for="employee-email" class="form-label">Email</label>
      <input type="email" id="employee-email" class="form-control" required>
    </div>

    <div class="mb-3">
      <label for="employee-password" class="form-label">Mot de passe</label>
      <input type="password" id="employee-password" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-success">Créer</button>
  </form>

  <div id="create-employee-feedback" class="mt-3"></div>
</div>

  <!-- Liste -->
  <div class="card p-4">
    <h2>Liste des employés</h2>
    <div id="employees-list">Chargement...</div>
  </div>
</section>
