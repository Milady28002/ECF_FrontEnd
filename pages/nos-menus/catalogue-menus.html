<section class="section-menus">
  <div class="container">

    <h2 class="menus-filters-title">Filtrer les menus</h2>

  <div class="menus-filters mb-4">
    <input type="number" id="prixMin" placeholder="Prix minimum">
    <input type="number" id="prixMax" placeholder="Prix maximum">

  <select id="theme">
    <option value="">Tous les thèmes</option>
    <option value="Classique">Classique</option>
    <option value="Noel / Paques">Noel / Paques</option>
    <option value="Evenement">Evenement</option>
  </select>

  <select id="regime">
    <option value="">Tous les régimes</option>
    <option value="Standard">🩵 Standard</option>
    <option value="Vegetarien">💛 Végétarien</option>
    <option value="Vegan">💚 Vegan</option>
  </select>

  <input type="number" id="personnesMin" placeholder="Nombre minimum de personnes">
  <button id="resetFilters" class="btn btn-outline-secondary">Réinitialiser</button>
  </div>

  <section id="menus-container"></section>
</div>
</section>
