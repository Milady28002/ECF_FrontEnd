<section class="signup-hero d-flex align-items-center">
  <div class="signup-hero_overlay"></div>

  <div class="container position-relative">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">

        <div class="card signup-card border-0">
          <div class="card-body p-4 p-md-7">

            <h1 class="text-center mb-4">Modifier son mot de passe</h1>

            <form aria-label="Formulaire d'inscription">
            

              <div class="mb-3">
                <label for="PasswordInput" class="form-label">Nouveau mot de passe</label>
                <input type="password" class="form-control" id="PasswordInput" name="Password" required>
              </div>

              <div class="mb-3">
                <label for="ValidatePasswordInput" class="form-label">
                  Validez votre nouveau mot de passe
                </label>
                <input type="password" class="form-control" id="ValidatePasswordInput" name="PasswordConfirm" required>
              </div>

              <div class="text-center">
                <button type="submit" class="btn btn-primary">
                  Valider
                </button>
              </div>
            </form>

          </div>
        </div>

      </div>
    </div>
  </div>
</section>
