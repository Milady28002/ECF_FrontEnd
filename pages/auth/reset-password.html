<section class="section-auth">
  <div class="container py-5">
    <div class="auth-card mx-auto">
      <h1 class="text-center mb-4">Modifier son mot de passe</h1>
        <p id="password-help" class="text-center mb-3 text-muted">
            Veuillez saisir un nouveau mot de passe sécurisé.
            </p>
            <form id="resetPasswordForm" aria-describedby="password-help">
                <div class="mb-3">
                    <label for="PasswordInput" class="form-label">Nouveau mot de passe</label>
                    <input
                    type="password"
                    class="form-control"
                    id="PasswordInput"
                    placeholder="Entrez votre nouveau mot de passe"
                    autocomplete="new-password"
                    required
                    >
                </div>

                <div class="mb-3">
                    <label for="ValidatePasswordInput" class="form-label">Confirmer le mot de passe</label>
                    <input
                    type="password"
                    class="form-control"
                    id="ValidatePasswordInput"
                    placeholder="Confirmez votre mot de passe"
                    autocomplete="new-password"
                    required
                    >
                </div>

                <p id="passwordMatchMessage" class="text-center mt-2" aria-live="polite"></p>

                <div class="text-center">
                    <button type="submit" class="btn btn-primary">
                    Réinitialiser le mot de passe
                    </button>
                </div>

                <p id="resetPasswordMessage" class="text-center mt-3"></p>

                </form>
           
    
    </div>
</section>
