<section class="signup-hero d-flex align-items-center">
  <div class="signup-hero_overlay"></div>

  <div class="container position-relative">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <div class="card signup-card border-0">
          <div class="card-body p-4 p-md-7">
            <h1 class="text-center mb-4">Mot de passe oublié</h1>
            <form id="forgotPasswordForm">
              <div class="mb-3">
                <label for="ForgotEmailInput" class="form-label">Adresse e-mail</label>
                <input type="email" class="form-control" id="ForgotEmailInput" name="email" autocomplete="email" required>
              </div>

              <div class="text-center">
                <button type="submit" class="btn btn-primary">
                  Envoyer le lien
                </button>
              </div>

              <p id="forgotPasswordMessage" class="text-center mt-3" aria-live="polite"></p>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
