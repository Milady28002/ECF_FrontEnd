<section class="section-account">
  <div class="container py-4">
    <div class="account-header">
      <div>
        <p class="account-label">Espace personnel</p>
        <h1>Mon compte</h1>
        <p class="account-subtitle">
          Retrouvez ici vos informations et les accès disponibles selon votre rôle.
        </p>
      </div>
    </div>

    <div class="account-grid">
      <article class="account-card">
        <h2>Mes informations</h2>

        <div class="account-info-list">
          <div class="account-info-item">
            <span class="account-info-label">Nom</span>
            <span id="account-name" class="account-info-value">-</span>
          </div>

          <div class="account-info-item">
            <span class="account-info-label">Prénom</span>
            <span id="account-firstname" class="account-info-value">-</span>
          </div>

          <div class="account-info-item">
            <span class="account-info-label">Email</span>
            <span id="account-email" class="account-info-value">-</span>
          </div>

          <div class="account-info-item">
            <span class="account-info-label">Téléphone</span>
            <span id="account-phone" class="account-info-value">-</span>
          </div>

          <div class="account-info-item">
            <span class="account-info-label">Rôle</span>
            <span id="account-role" class="account-badge">-</span>
          </div>
        </div>
      </article>

      <article class="account-card">
        <h2>Mes accès</h2>

        <div id="account-actions" class="account-actions"></div>
      </article>
    </div>
  </div>
</section>
